name: Windows launcher
on:
  push:
    paths: ['launcher/**', 'anima_webui/**', 'tests/**', 'static/**', 'templates/**', 'Build-Launcher.ps1', 'AnimaRandomStudio.ico', '.github/workflows/launcher.yml']
  pull_request:
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - run: node --check static/app.js
      - run: node --test tests/frontend_state.test.cjs
      - run: dotnet run -c Release --project launcher/Anima.Launcher.Tests
      - name: Verify package integrity checks
        shell: pwsh
        run: ./launcher/scripts/Test-LauncherPackage.ps1
      - name: Publish unsigned candidate
        shell: pwsh
        run: ./Build-Launcher.ps1 -CandidateDirectory '${{ github.workspace }}/dist/ci-candidate'
      - uses: actions/upload-artifact@v4
        with:
          name: AnimaRandomStudio-win-x64-unsigned
          if-no-files-found: error
          path: |
            dist/ci-candidate/AnimaRandomStudio-win-x64-unsigned.zip
            dist/ci-candidate/SHA256SUMS.txt
            dist/ci-candidate/candidate.json
